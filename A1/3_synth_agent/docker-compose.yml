services:
  frontend:
    build:
      context: ./frontend
    image: synth-agent-frontend:latest
    container_name: synth-agent-frontend
    ports:
      - "3000:80"    # NAS에서 3000번 포트로 접근: http://NAS_IP:3000
    depends_on:
      - server
    restart: unless-stopped

  server:
    build:
      context: ./server
    image: synth-agent-server:latest
    container_name: synth-agent-server
    restart: unless-stopped
